name: Unit tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: JVM unit tests + coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The secrets-gradle-plugin resolves BuildConfig.GEMINI_API_KEY at build time. It falls back
      # to .env.example when .env is absent, so no real key is needed to compile and run tests.
      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Generate coverage report
        if: success() || failure()
        run: ./gradlew --no-daemon :app:koverXmlReportDebug :app:koverHtmlReportDebug

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload coverage report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/kover/
