name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # No Gradle wrapper is checked in, so the action installs Gradle itself.
      # Tracking the current release rather than a pin, because the Gradle version
      # AGP requires moves with AGP.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      # app/build.gradle.kts signs the debug variant with $rootDir/debug.keystore,
      # which is gitignored and therefore absent on a fresh clone. README.md tells
      # humans to delete that signingConfig line locally; CI generates the keystore
      # instead so the committed build config is exercised as written.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Deliberately no --stacktrace: a Gradle stack trace is hundreds of lines of
      # framework internals that push the actual compiler diagnostics out of reach
      # of anything that reads the tail of the log. The full output is teed to a file
      # and summarised by the steps below instead.
      - name: Assemble debug
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain 2>&1 | tee -a build.log

      - name: Unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest -Proborazzi.test.record=true --console=plain 2>&1 | tee -a build.log

      - name: Lint
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:lint --console=plain 2>&1 | tee -a build.log

      # Runs only on failure, so its output is the last thing in the log — the part
      # that survives truncation when the log is read back through an API.
      - name: Compiler diagnostics
        if: failure()
        run: |
          {
            echo "### Kotlin compiler diagnostics"
            echo '```'
            grep -E '^(e|w): ' build.log \
              | sed 's|file://${{ github.workspace }}/||' \
              | head -120 \
              || echo "(no e:/w: lines found — see the failing test report or the build.log artifact)"
            echo '```'
            echo "### Failed tests"
            echo '```'
            grep -E '^.*> .* FAILED$|^\s+[A-Za-z].*FAILED' build.log | head -40 || echo "(none)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build.log
            app/build/reports/
            app/src/test/screenshots/
          if-no-files-found: ignore
          retention-days: 14
