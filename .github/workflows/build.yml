name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Android Build & Network Resilience Test Suite
  # -------------------------------------------------------------
  android-ci:
    name: Android Tests & APK Assembly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests (Wi-Fi, Cellular, Offline, Database & Security)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compile Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CiteCircle-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Android Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  # -------------------------------------------------------------
  # Job 2: Backend, Security Rules & Quota Validation
  # -------------------------------------------------------------
  backend-ci:
    name: Backend & Security CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Backend CI & Network Rules Suite
        run: node test/backend-ci.test.js

      - name: Run Supabase, Cloudflare R2 & Edge Integration Tests
        run: node test/supabase-integration.test.mjs

  # -------------------------------------------------------------
  # Job 3: Live Cloud Hosting & Connectivity Verification
  # -------------------------------------------------------------
  cloud-health:
    name: Cloud & Live Hosting Health Check
    runs-on: ubuntu-latest
    needs: [backend-ci]

    steps:
      - name: Verify Live Firebase Hosting (Primary Domain)
        run: |
          echo "Pinging https://cite-circle-3857b.web.app..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://cite-circle-3857b.web.app)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Failed to reach live primary domain"
            exit 1
          fi

      - name: Verify Live Firebase Hosting (Secondary Domain)
        run: |
          echo "Pinging https://cite-circle-3857b.firebaseapp.com..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://cite-circle-3857b.firebaseapp.com)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Failed to reach live secondary domain"
            exit 1
          fi

      - name: Verify Supabase Serverless Edge API (cite-server)
        run: |
          echo "Pinging Supabase Edge Function cite-server..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://cxxtrtglmxfuyihxwiza.supabase.co/functions/v1/cite-server)
          echo "Edge Function HTTP Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Failed to reach Supabase cite-server Edge Function"
            exit 1
          fi

      - name: Verify Live APK Public Download Endpoint
        run: |
          echo "Checking APK download URL..."
          STATUS=$(curl -s -I -o /dev/null -w "%{http_code}" https://cxxtrtglmxfuyihxwiza.supabase.co/storage/v1/object/public/app-releases/CiteCircle-latest.apk)
          echo "APK Storage HTTP Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Failed to reach live APK download URL"
            exit 1
          fi

  # -------------------------------------------------------------
  # Job 4: Deploy Web App to GitHub Pages
  # -------------------------------------------------------------
  deploy-pages:
    name: Deploy Web App to GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [backend-ci, cloud-health]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages Artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: Deploy to GitHub Pages
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
