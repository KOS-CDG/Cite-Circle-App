name: Build

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch supersedes the first; no point finishing a build for a
# commit nobody is looking at any more.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug + unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # JDK 21, not 17: Robolectric 4.16.1 requires Java 21 to run against SDK 36. On 17
      # every Robolectric test aborts with UnsupportedOperationException from
      # DefaultSdkProvider.verifySupportedSdk.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No secrets required. The secrets-gradle-plugin resolves BuildConfig.GEMINI_API_KEY
      # from .env and falls back to the checked-in .env.example, and the google-services
      # plugin is configured with MissingGoogleServicesStrategy.WARN so the placeholder
      # google-services.json does not fail the build.
      - name: Compile
        run: ./gradlew --no-daemon assembleDebug

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
