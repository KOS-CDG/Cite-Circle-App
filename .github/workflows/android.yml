name: Android CI

# This repository had no CI at all, which meant nothing ever verified that the project
# compiles -- and the project did not, in fact, compile (see the Phase 0 commit).
#
# GitHub-hosted ubuntu runners ship with the Android SDK preinstalled, so this is the
# cheapest place to get a real compile + test signal on every push.

# Branch pushes are deliberately NOT built here. A branch with an open PR would otherwise build
# every commit twice: once for `push` and once for `pull_request`. Trying to collapse those with a
# concurrency group does not work, because the two events disagree on every ref expression
# (`github.ref` is refs/pull/N/merge vs refs/heads/<branch>, and `head_ref` is empty on push).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # cache-read-only defaults to "write only from the default branch", which meant every run on
      # this branch started completely cold -- re-downloading the Gradle distribution, AGP, Kotlin
      # and the whole Compose stack. That is why compiles here take ~10 minutes rather than ~4.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # (A `buildEnvironment` diagnostic step lived here while the Kotlin/Compose-compiler version
      # mismatch was being chased down. That is resolved and pinned, and the step was costing
      # ~1-6 minutes per run, so it is gone. Re-add it if the toolchain versions drift again.)

      # The Secrets Gradle Plugin reads .env and falls back to .env.example, which carries a
      # placeholder key. The Gemini client is not exercised by any test, so a placeholder is fine.
      - name: Compile debug
        run: ./gradlew assembleDebug --stacktrace

      # -Proborazzi.test.record=true is load-bearing, not a flag worth trimming. Roborazzi's
      # captureRoboImage() is a no-op unless record, compare or verify mode is explicitly on, so a
      # plain testDebugUnitTest runs every screenshot test, passes, and writes zero images. That
      # failed silently once already. The record flag is the only thing that makes the suite real.
      - name: Unit tests and screenshots
        run: ./gradlew testDebugUnitTest -Proborazzi.test.record=true --stacktrace

      # app/schemas/**/1.json is committed, so Room's generated schema must match it exactly.
      # A drift here means someone changed an entity without bumping the database version, which
      # would break @AutoMigration later in a much more confusing way.
      # Prints the full contents of anything new or changed, not just a diff. A newly generated
      # schema (say, after a version bump) is untracked, so `git diff` would show nothing at all
      # and the failure would be useless. Printing it means the schema can be committed straight
      # from the log without a local Android SDK.
      #
      # Known limitation: this only catches drift when KSP actually re-ran. On a fully cached
      # build kspDebugKotlin is UP-TO-DATE, Room does not rewrite app/schemas, and the check
      # passes vacuously. That is acceptable because any commit touching Kotlin sources -- which
      # is any commit that could change the schema -- re-runs KSP.
      - name: Check Room schema is committed and unchanged
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::Room schema is not committed. Contents follow -- commit these files."
            git status --porcelain app/schemas
            for f in app/schemas/*/*.json; do
              [ -e "$f" ] || continue
              echo "===== BEGIN $f ====="
              cat "$f"
              echo ""
              echo "===== END $f ====="
            done
            exit 1
          fi
          echo "Room schema matches the committed version."

      # Kept as a convenience copy of the generated schemas. The drift check above is the thing
      # that actually enforces they are committed.
      - name: Upload generated Room schemas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn

      # The whole point of the Roborazzi suite: this repository cannot be built or run without an
      # Android SDK, so CI is the only place the redesign can actually be *looked at*. Downloading
      # this artifact is how you review the palette and the components in both schemes.
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        # success(), not always(): paired with if-no-files-found: error, an always() step would
        # add a second, misleading failure on top of every genuine compile or test failure.
        if: success()
        with:
          name: screenshots
          path: app/src/test/screenshots/
          # error, not warn: an empty directory here means the captures silently stopped being
          # produced, which is precisely how this went unnoticed the first time.
          if-no-files-found: error

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/outputs/
          if-no-files-found: ignore
